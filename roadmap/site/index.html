<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>UniDeX Roadmap</title>
<meta name="description" content="What's coming to UniDeX, from first idea to release.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'%3E%3Crect width='56' height='56' rx='14' fill='%23e6edf3'/%3E%3Cg transform='translate(9.8 21.56) scale(.28)' stroke='%230d1117' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'%3E%3Cpath d='M6 6V26a14 14 0 0 0 28 0V6 M48 6V40H60a17 17 0 0 0 0-34H48Z M92 6L124 40 M124 6L92 40'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<!-- The saved theme before first paint (app.js owns the toggle); nothing here loads from outside this folder. -->
<script>try { var t = localStorage.getItem('udx-roadmap-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<a class="skip" href="#board">Skip to the roadmap</a>
<div class="layout">
  <div class="page">
    <header class="masthead">
      <a class="mark" href="{{REPO_URL}}" rel="noopener" aria-label="UniDeX on GitHub">
        <svg viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" rx="14"/><g transform="translate(9.8 21.56) scale(.28)"><path d="M6 6V26a14 14 0 0 0 28 0V6 M48 6V40H60a17 17 0 0 0 0-34H48Z M92 6L124 40 M124 6L92 40"/></g></svg>
      </a>
      <div class="title">
        <h1>UniDeX Roadmap</h1>
        <p class="tagline">{{INTRO}} <span class="updated">updated from roadmap.md on {{UPDATED}}</span></p>
      </div>
      <nav class="links" aria-label="Links">
        <a href="{{REPO_URL}}" rel="noopener">GitHub</a>
        <a href="{{REPO_URL}}/blob/main/roadmap/roadmap.md" rel="noopener">roadmap.md</a>
        <button type="button" class="theme" data-theme-toggle aria-live="polite">◐ Auto</button>
      </nav>
    </header>

    <main>
      <div class="filters">{{FILTERS}}</div>
      <div class="board" id="board">{{LANES}}</div>
      {{SHIPPED}}
    </main>

    <footer class="foot">
      Built from <a href="{{REPO_URL}}/blob/main/roadmap/roadmap.md" rel="noopener">roadmap.md</a> on every change ·
      <a href="{{REPO_URL}}/blob/main/roadmap/README.md" rel="noopener">How the roadmap works</a>
    </footer>
  </div>

  <aside class="panel" aria-label="Item details">{{DETAILS}}</aside>
</div>
<script src="app.js"></script>
</body>
</html>

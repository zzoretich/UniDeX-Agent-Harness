name: roadmap
# Builds roadmap/roadmap.md into the public roadmap page and deploys it to GitHub Pages (spec 2026-11-11-roadmap-design
# D7-D8). As in release.yml, the build job is read-only, and only the deploy job holds a write token; it runs nothing
# from the repository, only deploys the artifact the build uploaded. Every pull request already ran
# `node tools/roadmap.js check` in ci.yml's lint job (D9).
on:
  push:
    branches: [main]
    paths: ['roadmap/**', 'tools/roadmap.js', '.github/workflows/roadmap.yml']
  workflow_dispatch:
permissions:
  contents: read
# One deploy at a time, and a running one is never cancelled (a half-finished Pages deploy is worse than a late one).
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the "updated" date is the last commit that touched roadmap.md
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: node tools/roadmap.js check
      - run: node tools/roadmap.js build --out _site --updated "$(git log -1 --format=%cs -- roadmap/roadmap.md)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
